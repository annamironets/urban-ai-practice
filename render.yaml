services:
  - type: web
    name: urban-ai-school-placement-api
    runtime: python
    rootDir: school-placement
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SCHOOL_PLACEMENT_ALLOWED_ORIGINS
        value: https://annamironets.github.io
